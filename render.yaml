# Render Blueprint: one static site (frontend) + one web service (API).
# The frontend calls the API directly via VITE_API_URL (cross-site cookies: SameSite=None).
services:
  - type: web
    name: wedding-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: COOKIE_SAMESITE
        value: none
      - key: DATABASE_URL
        sync: false          # your SQL Server connection string
      - key: CLIENT_ORIGINS
        sync: false          # https://<your-static-site>.onrender.com (or your custom domain)
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: SESSION_TOKEN_SECRET
        generateValue: true

  - type: web
    name: wedding-site
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://wedding-api.onrender.com   # your API service URL, no trailing slash
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
